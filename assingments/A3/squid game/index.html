<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Squid Game Landing Page</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <!-- Main Container -->
  <div class="container">
     <div class="background">
         <img src="background1.png" alt="background">
    </div>

    <!-- Navbar -->
    <nav class="navbar">

      <div class="logo">
        <img src="logo.png" alt="logo">
      </div>

      <ul class="nav-links">
        <li><a href="#">About</a></li>
        <li><a href="#" class="active">Watch now</a></li>
        <li><a href="#">Actors</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <div class="menu-icon">
        <i class="fa-solid fa-bars"></i>
      </div>

    </nav>

    <!-- Hero Section -->
    <section class="hero-section">

      <!-- Left Content -->
      <div class="left-content">

        <img src="logo.png" class="main-logo" alt="Squid Game">

        <p>
          Action / Thriller / Drama Series directed by Dong-hyuk Hwang
          <br>
          Season 1: 9 Episodes
        </p>

        <!-- Buttons -->
        <div class="buttons">

          <button class="play-btn">
            <i class="fa-solid fa-play"></i>
            Play Now
          </button>

          <button class="trailer-btn">
            <i class="fa-regular fa-circle-play"></i>
            Watch Trailer
          </button>

        </div>

      </div>

      <!-- Right Image -->
      <div class="right-content">
        <img src="image 2.png" alt="guard">
      </div>

      <!-- Scroll -->
      <div class="scroll">
        <span>SCROLL</span>
        <div class="line"></div>
      </div>

      <!-- Social Icons -->
      <div class="social-icons">
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-facebook-f"></i>
      </div>

    </section>

    <!-- Cards Section -->
    <section class="cards-section">

      <div class="card">
        <img src="image 1.png" alt="card1">
        <div class="play-icon">
          <i class="fa-solid fa-play"></i>
        </div>
      </div>

      <div class="card">
        <img src="card2.jpg" alt="card2">
        <div class="play-icon">
          <i class="fa-solid fa-play"></i>
        </div>
      </div>

      <div class="card">
        <img src="card3.jpg" alt="card3">
        <div class="play-icon">
          <i class="fa-solid fa-play"></i>
        </div>
      </div>

    </section>

  </div>

</body>
</html>
